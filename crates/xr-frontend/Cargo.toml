[package]
name = "xr-frontend"
version.workspace = true
# ported from Zakuro's `zakuro` crate (edition 2021); kept on 2021 so upstream diffs apply cleanly
edition = "2021"
license = "MIT"
description = "RE:DEX's window, input and sound, ported from Zakuro's frontend"

[dependencies]
xr-hle = { path = "../xr-hle" }
redex-builder = { path = "../redex-builder" }
xr-net = { path = "../xr-net" }
redex-proto = { path = "../redex-proto" }
getrandom = "0.3"
serde_json = "1"
# Pokémon Storage checks PKVault's download against its release's SHA-256
sha2 = "0.10"
zakuro-common.workspace = true
zakuro-gpu.workspace = true
log.workspace = true
serde.workspace = true
winit = { version = "0.30", features = ["serde"] }
raw-window-handle = "0.6"
glutin = "0.32"
glutin-winit = "0.5"
cpal = "0.16"
toml = "1.1.6"
gilrs = { version = "0.11.2", features = ["serde-serialize"] }
# the menu over the game, as Zakuro draws it
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.36", default-features = false, features = ["clipboard"] }
png = "0.18.1"
# the Mods screen's pictures from GameBanana (JPEGs)
zune-jpeg = "0.5"

[target.'cfg(windows)'.dependencies]
# the native menu bar across the window, like Azahar's (Windows only for now, elsewhere menubar.rs has a stub)
muda = { version = "0.17", default-features = false }
# reads Windows' "Show animations" setting, the menus keep still w/o it
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# the Switch's Pro Controller read from its own reports, opened shared w/ the system, which puts it in a mode gilrs reads wrong
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }
